# Codemagic — сборка Yumurta iOS и автозагрузка в TestFlight.
# Подпись — ЯВНО в скриптах через app-store-connect fetch-signing-files --create
# (без блока ios_signing, чтобы встроенная автоподпись не падала раньше времени).
# Bundle id: ru.marketplace.client.premium
#
# В Codemagic должен быть подключён ключ App Store Connect с именем  yumurta_asc.

workflows:
  ios-release:
    name: Yumurta iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: yumurta_asc
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "ru.marketplace.client.premium"
    scripts:
      - name: XcodeGen
        script: |
          which xcodegen || brew install xcodegen
          cd "$CM_BUILD_DIR" && xcodegen generate
      - name: Номер сборки
        script: |
          cd "$CM_BUILD_DIR" && agvtool new-version -all "$BUILD_NUMBER"
      - name: Создать сертификат и профиль, применить
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Сборка .ipa
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "YumurtaPremium.xcodeproj" \
            --scheme "YumurtaPremium"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

workflows:
  ios-release:
    name: Yumurta iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: yumurta_asc
    environment:
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - yumurta_appstore
        certificates:
          - yumurta_dist
    scripts:
      - name: XcodeGen
        script: |
          which xcodegen || brew install xcodegen
          cd "$CM_BUILD_DIR" && xcodegen generate

      # Версию пишем ПОСЛЕ XcodeGen и прямо в готовый Info.plist.
      #
      # Почему не через настройки проекта: XcodeGen при генерации Info.plist
      # подставляет собственное умолчание CFBundleShortVersionString = "1.0"
      # литералом и MARKETING_VERSION для этого не использует. Из-за этого
      # версия оставалась 1.0 в каждой сборке, а Apple отклоняла публикацию:
      #   90062 — версия должна быть выше уже одобренной 1.0
      #   90186 — ветка TestFlight 1.0 закрыта для новых сборок
      # PlistBuddy правит собранный файл — это не зависит ни от XcodeGen,
      # ни от порядка применения настроек.
      #
      # Версию можно задать переменной APP_VERSION в настройках workflow;
      # без неё берётся значение из project.yml.
      - name: Версия и номер сборки
        script: |
          cd "$CM_BUILD_DIR"
          PLIST="Generated/Info.plist"
          VERSION="${APP_VERSION:-$(grep -m1 'CFBundleShortVersionString:' project.yml | sed 's/.*: *"\(.*\)"/\1/')}"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$PLIST"
          agvtool new-version -all "$BUILD_NUMBER"

          FINAL_V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          FINAL_B=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "─────────────────────────────────────────"
          echo "  Уйдёт в App Store: версия $FINAL_V, сборка $FINAL_B"
          echo "─────────────────────────────────────────"

          # Ранняя проверка: лучше упасть здесь за секунду, чем собирать
          # четыре минуты и получить отказ на публикации.
          if [ -z "$FINAL_V" ] || [ "$FINAL_V" = "1.0" ]; then
            echo "ОШИБКА: версия '$FINAL_V' не годится. Apple не примет 1.0 —"
            echo "эта ветка уже одобрена и закрыта для новых сборок."
            echo "Поправьте CFBundleShortVersionString в project.yml"
            echo "или задайте переменную APP_VERSION в настройках workflow."
            exit 1
          fi

      - name: Применить профиль
        script: |
          xcode-project use-profiles --project "$CM_BUILD_DIR/YumurtaPremium.xcodeproj"
      - name: Сборка .ipa
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa --project "YumurtaPremium.xcodeproj" --scheme "YumurtaPremium"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
name: YumurtaPremium
options:
  bundleIdPrefix: ru.marketplace.client.premium
  createIntermediateGroups: true
targets:
  YumurtaPremium:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Yumurta
        NSLocationWhenInUseUsageDescription: "Нужно, чтобы определить ваш город и показать курьера на карте во время доставки"
        UILaunchScreen:
          UIColorName: LaunchBG
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: ru.marketplace.client.premium
            CFBundleURLSchemes: [yumurta]
    entitlements:
      path: Generated/YumurtaPremium.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.marketplace.client.premium
        # Версия для App Store (CFBundleShortVersionString).
        # 1.0 уже одобрена Apple, поэтому её нельзя отправить повторно:
        # сборка падала с 90062 «must contain a higher version» и 90186
        # «train version '1.0' is closed for new build submissions».
        # Значение можно не править руками: если в Codemagic задать
        # переменную APP_VERSION, шаг «Версия приложения» подставит её сюда.
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
